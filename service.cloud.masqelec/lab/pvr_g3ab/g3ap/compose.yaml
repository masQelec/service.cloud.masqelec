# G3-AP: isolated continuous synthetic MPEG-TS HTTP source, OFFLINE only.
# Reuse preinstalled local linuxserver/tvheadend image with Python and FFmpeg.
# No build or pull; bypass its normal TVH init/entrypoint and serve only G3-AP.
name: masqelec-pvr-g3ap
services:
  live:
    image: lscr.io/linuxserver/tvheadend:latest
    pull_policy: never
    entrypoint: ["/usr/bin/python3", "-u", "/opt/g3ap/server.py"]
    command: []
    read_only: true
    init: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    volumes:
      - ./server.py:/opt/g3ap/server.py:ro
      - ../runtime/streams:/source:ro
    networks:
      pvr_g3ab:
        aliases: [g3ap-live]
    restart: "no"
networks:
  pvr_g3ab:
    external: true
    name: masqelec-pvr-g3ab_pvr_g3ab
